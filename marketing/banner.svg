<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 548" width="1120" height="548" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B4EA2"/>
      <stop offset="1" stop-color="#083A7C"/>
    </linearGradient>
  </defs>
  <rect width="1120" height="548" fill="url(#sky)"/>

  <!-- the text a reader types, on the left -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
     font-size="27" fill="#AED0F8">
    <text x="84" y="196">flowchart LR</text>
    <text x="84" y="236">  A[Request] --&gt; B{Cached?}</text>
    <text x="84" y="276">  B -- yes --&gt; C[Serve]</text>
    <text x="84" y="316">  B -- no  --&gt; D[Fetch]</text>
  </g>

  <!-- the arrow across -->
  <g stroke="#4C8FE0" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M520 256 H592"/>
    <path d="M578 244 L592 256 L578 268"/>
  </g>

  <!-- what they get, on the right -->
  <g>
    <rect x="636" y="234" width="104" height="46" rx="9" fill="#FFFFFF"/>
    <path d="M840 212 L886 256 L840 300 L794 256 Z" fill="#FFFFFF"/>
    <rect x="936" y="176" width="104" height="46" rx="9" fill="#8CBBF4"/>
    <rect x="936" y="290" width="104" height="46" rx="9" fill="#8CBBF4"/>
    <g stroke="#AED0F8" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M740 257 H794"/>
      <path d="M872 232 L936 200"/>
      <path d="M872 280 L936 312"/>
    </g>
  </g>

  <text x="84" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="40" font-weight="600" fill="#FFFFFF">Mermaid diagrams, written as text</text>
  <text x="84" y="466" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="26" fill="#AED0F8">Stored in the macro, so editing the page never breaks them</text>
</svg>
